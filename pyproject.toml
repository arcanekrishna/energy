[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-power-market-intelligence"
version = "0.1.0"
description = "Multi-Horizon Probabilistic Framework for Indian Electricity Market Intelligence and Stakeholder-Oriented Risk Forecasting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "jinja2>=3.1.0", "plotly>=5.15.0"]
explain = ["shap>=0.42.0"]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]
all = ["indian-power-market-intelligence[dashboard,explain,dev]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "studies*"]
